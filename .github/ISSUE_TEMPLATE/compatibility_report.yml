name: Compatibility report
description: Tell us how Steppe runs on your Mac
labels: [compatibility]
body:
  - type: input
    id: mac
    attributes:
      label: Mac, chip, memory, macOS
      placeholder: "MacBook Air, M2, 16 GB, macOS 15.2"
    validations: { required: true }
  - type: input
    id: display
    attributes:
      label: Display and preset
      placeholder: "Built-in 1470x956, Balanced (default)"
    validations: { required: true }
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: ["Works well", "Works with problems", "Does not work"]
    validations: { required: true }
  - type: textarea
    id: details
    attributes:
      label: Details
      description: "Frame rate or frame times if you recorded them (Settings → Advanced → Record frame times), problems seen, multiplayer results."
