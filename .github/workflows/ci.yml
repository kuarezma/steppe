name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Install mingw-w64 (builds the Windows helper DLLs)
        run: brew install mingw-w64

      - name: Swift unit tests
        run: swift test

      - name: Localization keys are complete
        run: python3 Scripts/extract-strings.py --check

      - name: Native components build
        run: |
          make -C Native/glfix
          make -C Native/vorbis-fast
          make -C Native/dialog-helper

      - name: glfix tests (GL-less runners skip the GL cases)
        run: make -C Native/glfix test

      - name: Build the app bundle
        run: Scripts/build-app.sh
        env:
          VERSION: 0.0.0-ci

      - name: Privacy scan of the bundle
        run: |
          ! grep -rIl -E "/Users/[A-Za-z0-9_.-]+/" dist/Steppe.app || { echo "home path found"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Steppe-ci
          path: dist/Steppe.app
          retention-days: 7
