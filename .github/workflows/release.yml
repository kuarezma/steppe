name: Release

# Push a tag such as v0.2.0 to build, sign the update feed and publish a GitHub release.
# Required repository secret: SPARKLE_PRIVATE_KEY (the exported EdDSA private key; see docs/RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mingw-w64
        run: brew install mingw-w64

      - name: Run tests
        run: |
          python3 Scripts/verify-appcast.py --selftest
          python3 Scripts/extract-strings.py --check
          swift test
          make -C Native/glfix clean test
          make -C Native/vorbis-fast clean test
          make -C Native/dialog-helper clean test

      - name: Build, package and sign the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "SPARKLE_PRIVATE_KEY secret is empty" >&2; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/sparkle.key"' EXIT
          VERSION="${GITHUB_REF_NAME#v}"
          (umask 077 && printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key")
          swift package resolve
          VERSION="$VERSION" SPARKLE_PRIVATE_KEY_FILE="$RUNNER_TEMP/sparkle.key" Scripts/release.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="docs/release-notes/$VERSION.md"
          [ -f "$NOTES" ] || { echo "Release notes for $VERSION" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          PRERELEASE_FLAG=()
          [[ "$VERSION" == *-* ]] && PRERELEASE_FLAG=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            dist/release/Steppe-"$VERSION".dmg dist/release/Steppe-"$VERSION".zip \
            dist/release/appcast.xml dist/release/SHA256SUMS.txt \
            --title "Steppe $VERSION" --notes-file "$NOTES" --draft \
            ${PRERELEASE_FLAG[@]+"${PRERELEASE_FLAG[@]}"}
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for expected in "Steppe-${VERSION}.dmg" "Steppe-${VERSION}.zip" "appcast.xml" "SHA256SUMS.txt"; do
            printf '%s\n' "$assets" | grep -qxF "$expected" || { echo "Missing uploaded asset: $expected" >&2; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false
